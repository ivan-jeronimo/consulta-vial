name: consulta-vial

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: base
  image: consulta-vial/php:8.3
  working_dir: /var/www/html
  # Todo (php-fpm, worker y `docker compose exec app php artisan …`) corre como
  # www-data: si un comando crea archivos como root (vistas compiladas, logs,
  # caché), php-fpm ya no puede actualizarlos y el panel responde 500.
  user: www-data
  environment:
    COMPOSER_HOME: /tmp/composer
  volumes:
    - ./backend:/var/www/html
    # vendor/ dentro de Linux: leerlo desde el disco de Windows hace cada
    # petición ~40x más lenta (miles de archivos cruzando el bind mount).
    - vendor:/var/www/html/vendor
  # Laravel lee backend/.env desde el volumen; no usar env_file aquí (sus
  # valores quedarían congelados al crear el contenedor y tendrían prioridad).
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # API Laravel (PHP-FPM)
  app:
    <<: *php

  # Servidor HTTP delante de PHP-FPM
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Worker de colas: ingesta de reglamentos (parsing, chunking y embeddings)
  worker:
    <<: *php
    command: >
      php artisan queue:work redis
      --queue=ingesta,default
      --timeout=3600
      --tries=3
      --memory=768
      --sleep=3
    stop_grace_period: 60s

  # Frontend público (React + Vite) con recarga en vivo: http://localhost:5173
  frontend:
    image: node:22-alpine
    working_dir: /app
    # npm install es casi instantáneo si nada cambió; instala lo nuevo del package-lock.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # Dentro de Docker, la API se alcanza por el nombre del servicio nginx.
      VITE_API_PROXY: http://nginx
      # Los cambios hechos desde Windows no llegan como eventos al contenedor.
      VITE_USAR_POLLING: "1"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules dentro de Linux: Vite y Tailwind traen binarios distintos
      # para Windows y Linux, y así no se leen miles de archivos por el bind mount.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-consulta_vial}
      POSTGRES_USER: ${DB_USERNAME:-consulta_vial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  vendor:
  frontend_node_modules:
  pgdata:
  redisdata:
