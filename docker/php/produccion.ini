; En producción el código no cambia dentro del contenedor: no revisar los .php.
opcache.validate_timestamps = 0
; El LLM puede tardar hasta ~2 min con reintentos y modelo de respaldo; si PHP
; cortara antes, la persona vería un error en vez de los artículos encontrados.
max_execution_time = 150
expose_php = Off
display_errors = Off
